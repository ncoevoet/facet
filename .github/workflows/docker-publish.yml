name: Docker Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Slim CPU image — the default `docker compose up` pull target.
          # Shares requirements.lock.txt with the cuda entry: STRIP_TORCH=0
          # installs torch from the CPU wheel index first (2.13.0+cpu before the pin),
          # which requires sympy>=1.13.3 — so the old sympy==1.13.1 pin made pip
          # replace it with torch 2.6.0 plus 13 CUDA 12.4 nvidia-* wheels. That
          # is what the published `latest` shipped: 8.81 GB of torch 2.6.0+cu124
          # in the image whose entire point is having no CUDA in it.
          - name: cpu
            suffix: ""
            base_image: python:3.12-slim
            strip_torch: "0"
            install_cuml: "0"
            requirements_lock: requirements.lock.txt
            # Smoke-test expectations. torch here is installed from the CPU wheel
            # index at the Dockerfile's CPU_TORCH_VERSION (the cuda entry's torch),
            # so the two images run the same release; expect_arch is empty because
            # a CPU build has no cubins.
            expect_torch: "2.11.0+cpu"
            expect_cuda: ""
            expect_arch: ""
            # ONNX Runtime (issue #229): "1" = onnxruntime-gpu alone, "0" = onnxruntime
            # alone. onnxruntime and onnxruntime-gpu share one onnxruntime/ directory and
            # insightface requires the CPU one, so a CUDA image only ends on the GPU
            # build if the Dockerfile swaps it in after the restricted lock.
            expect_ort_cuda: "0"
          # Full CUDA + RAPIDS cuML image, same as a local `docker build` with
          # the Dockerfile's own defaults. CUDA 12.8 / torch 2.11.0 ships
          # sm_75...sm_120, so this is the Blackwell-capable tag (issue #119) and
          # the one the GPU compose overlays point at.
          - name: cuda
            suffix: "-cuda"
            base_image: pytorch/pytorch:2.11.0-cuda12.8-cudnn9-runtime
            strip_torch: "1"
            install_cuml: "1"
            requirements_lock: requirements.lock.txt
            # Pinned to what the base image tag ships, so bumping that tag fails
            # the smoke test until these move with it — deliberately.
            expect_torch: "2.11.0+cu128"
            expect_cuda: "12.8"
            expect_arch: "sm_120"
            expect_ort_cuda: "1"
          # Previous CUDA image, kept as its own tag because the 12.8 wheel above
          # DROPS sm_50/sm_60/sm_70: CUDA 12.6 / torch 2.6.0 ships sm_50...sm_90,
          # which is the only build Maxwell, Pascal and Volta cards can run. It
          # needs its own lock — torch 2.6.0 requires sympy==1.13.1 exactly and
          # torch 2.11.0 requires >=1.13.3, so one lock cannot serve both and the
          # wrong one makes pip replace the base image's whole CUDA stack.
          - name: cuda-legacy
            suffix: "-cuda-legacy"
            base_image: pytorch/pytorch:2.6.0-cuda12.6-cudnn9-runtime
            strip_torch: "1"
            install_cuml: "1"
            requirements_lock: requirements.legacy.lock.txt
            expect_torch: "2.6.0+cu126"
            expect_cuda: "12.6"
            expect_arch: "sm_50"
            expect_ort_cuda: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Disable metadata-action's own auto-latest heuristic — with three
          # variants pushing to the same image name, it would tag every CUDA
          # build "latest" (no suffix) too and clobber the CPU image's tag.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}}${{ matrix.suffix }}
            type=raw,value=latest${{ matrix.suffix }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Reclaim runner disk before a multi-GB build
        # The CUDA variants are ~13 GB each, and the smoke test below needs the
        # finished image in the local daemon on top of the build cache. A stock
        # ubuntu-latest runner has no room for both, so drop the preinstalled
        # toolchains this workflow never touches.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h /

      - name: Build
        # load, not push. setup-buildx-action installs the docker-container
        # driver, and a build on that driver leaves NOTHING on the local daemon
        # unless it is loaded (verified: `docker image inspect` finds no such
        # image afterwards), so `docker run` could not reach it. Pushing first
        # and testing after would make the smoke test a post-mortem on an image
        # users are already pulling; loading here and pushing only after the
        # test keeps it a GATE. The Push step below re-uses this step's GHA
        # cache, so nothing is compiled twice.
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          # x86_64 only, stated explicitly rather than inherited from the runner.
          # arm64 would have to cross-build under QEMU, which for a multi-GB ML
          # image costs hours per tag, and the CUDA variant is amd64-only anyway.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            STRIP_TORCH=${{ matrix.strip_torch }}
            INSTALL_CUML=${{ matrix.install_cuml }}
            REQUIREMENTS_LOCK=${{ matrix.requirements_lock }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Smoke-test the built image
        # The Dockerfile's own build-time assertion cannot cover any of this: it
        # runs mid-build, as root, before the runtime user exists. That is how a
        # UID flip from 1000 to 1001 went unnoticed — the CUDA 12.8 base ships
        # its own `ubuntu` at 1000, so a bare useradd lands on 1001 — which would
        # have made an existing install's SQLite database read-only on the next
        # `docker compose pull`. Only running the finished image sees it.
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          VARIANT: ${{ matrix.name }}
          EXPECT_TORCH: ${{ matrix.expect_torch }}
          EXPECT_CUDA: ${{ matrix.expect_cuda }}
          EXPECT_ARCH: ${{ matrix.expect_arch }}
          EXPECT_ORT_CUDA: ${{ matrix.expect_ort_cuda }}
        run: |
          set -euo pipefail
          image="${IMAGE_TAGS%%$'\n'*}"
          echo "Smoke-testing $VARIANT: $image"
          fail=0

          uid=$(docker run --rm --entrypoint id "$image" -u facet)
          gid=$(docker run --rm --entrypoint id "$image" -g facet)
          echo "runtime user facet = $uid:$gid"
          if [ "$uid:$gid" != "1000:1000" ]; then
            echo "::error::runtime user facet is $uid:$gid, expected 1000:1000. The entrypoint's chown is deliberately NOT recursive, so every file an existing install already wrote stays 1000 and a different UID cannot write it — the database opens read-only."
            fail=1
          fi

          torch_version=$(docker run --rm --entrypoint python "$image" -c 'import torch; print(torch.__version__)')
          torch_cuda=$(docker run --rm --entrypoint python "$image" -c 'import torch; print(torch.version.cuda or "")')
          # torch.cuda.get_arch_list() short-circuits to [] when no CUDA device
          # is present and these runners have no GPU, so read the flags the
          # extension was compiled with instead. Absent entirely on a CPU build.
          torch_arch=$(docker run --rm --entrypoint python "$image" -c 'import torch; f = getattr(torch._C, "_cuda_getArchFlags", None); print(f() if f else "")')
          echo "torch $torch_version | cuda ${torch_cuda:-none} | arch ${torch_arch:-none}"

          if [ -n "$EXPECT_TORCH" ] && [ "$torch_version" != "$EXPECT_TORCH" ]; then
            echo "::error::torch is $torch_version, expected $EXPECT_TORCH. Either BASE_IMAGE and REQUIREMENTS_LOCK drifted apart, or the base image tag moved under us."
            fail=1
          fi
          if [ "$torch_cuda" != "$EXPECT_CUDA" ]; then
            echo "::error::torch reports CUDA '${torch_cuda}', expected '${EXPECT_CUDA}' for the $VARIANT variant."
            fail=1
          fi
          if [ -n "$EXPECT_ARCH" ] && ! printf '%s\n' $torch_arch | grep -qx "$EXPECT_ARCH"; then
            echo "::error::compiled arch flags '$torch_arch' do not include $EXPECT_ARCH. This is issue #119 exactly: the image starts, reports a GPU, and then dies on the first kernel with 'no kernel image is available for execution on the device'."
            fail=1
          fi

          # ONNX Runtime (issue #229). onnxruntime and onnxruntime-gpu install into the
          # same onnxruntime/ directory, so exactly one may be present, and insightface
          # requires the CPU one: a CUDA image that ran the restricted lock last would
          # silently ship the CPU build and run face detection on the CPU.
          if [ "$EXPECT_ORT_CUDA" = 1 ]; then expect_ort=onnxruntime-gpu; else expect_ort=onnxruntime; fi
          ort_dists=$(docker run --rm --entrypoint python "$image" -c 'import importlib.metadata as m; print(" ".join(n for n in ("onnxruntime", "onnxruntime-gpu") if any(d.metadata["Name"] == n for d in m.distributions())))')
          echo "ONNX Runtime distributions: ${ort_dists:-none} (expected $expect_ort)"
          if [ "$ort_dists" != "$expect_ort" ]; then
            echo "::error::ONNX Runtime distributions are '${ort_dists:-none}', expected '$expect_ort' for the $VARIANT variant (issue #229). onnxruntime and onnxruntime-gpu share one onnxruntime/ directory and insightface requires the CPU one, so the CUDA images must install onnxruntime-gpu after the restricted lock and the CPU image must not carry the GPU build."
            fail=1
          fi
          # torch first, as Facet does at scan time: it maps the CUDA libraries the ONNX
          # Runtime CUDA provider then reuses. This lists what the wheel was COMPILED
          # with; the link check below is what proves its libraries resolve.
          ort_cuda_listed=$(docker run --rm --entrypoint python "$image" -c 'import torch, onnxruntime; print(int("CUDAExecutionProvider" in onnxruntime.get_available_providers()))')
          echo "CUDAExecutionProvider listed: $ort_cuda_listed (expected $EXPECT_ORT_CUDA)"
          if [ "$ort_cuda_listed" != "$EXPECT_ORT_CUDA" ]; then
            echo "::error::onnxruntime lists CUDAExecutionProvider=$ort_cuda_listed, expected $EXPECT_ORT_CUDA for the $VARIANT variant (issue #229)."
            fail=1
          fi
          # No GPU on the runner, so no CUDA session can be created: ask the dynamic
          # linker whether the provider library's CUDA dependencies resolve against the
          # libraries torch maps. onnxruntime-gpu 1.27+ is a CUDA 13 build and fails here
          # on its *.so.13 libraries; exit 2 means the check itself went vacuous.
          if [ "$EXPECT_ORT_CUDA" = 1 ]; then
            if docker run --rm -i --entrypoint python "$image" - < scripts/check_ort_cuda_link.py; then
              echo "onnxruntime CUDA provider libraries resolve"
            else
              echo "::error::the onnxruntime CUDA provider's libraries do not resolve in the $VARIANT image (scripts/check_ort_cuda_link.py exited non-zero; 1 = unresolved library or no provider, 2 = the check went vacuous). An onnxruntime-gpu 1.27+ wheel is a CUDA 13 build and cannot load beside CUDA 12 torch (issue #229)."
              fail=1
            fi
          fi

          # exiftool 13.23-13.27 corrupts XMP sidecars with darktable history
          # (issue #176); the image pins a release past that, and this fails
          # the job if a base-image or Dockerfile change ever swaps it back.
          exif_version=$(docker run --rm --entrypoint exiftool "$image" -ver)
          echo "exiftool $exif_version"
          if ! printf '%s' "$exif_version" | grep -Eq '^[0-9]+\.[0-9]+$' \
             || ! awk -v v="$exif_version" 'BEGIN { split(v, a, "."); exit !(a[1] > 13 || (a[1] == 13 && a[2] >= 28)) }'; then
            echo "::error::exiftool is '$exif_version', expected >= 13.28. Versions 13.23-13.27 corrupt XMP sidecars that carry darktable edit history (issue #176)."
            fail=1
          fi

          if docker run --rm "$image" python facet.py --doctor > doctor.log 2>&1; then
            echo "facet.py --doctor exited 0 through the real entrypoint"
          else
            echo "::error::facet.py --doctor failed inside the image — the entrypoint, the privilege drop, or the app itself is broken."
            tail -40 doctor.log
            fail=1
          fi
          # The doctor's ONNX Runtime section (issue #229). A GPU-less runner selects the
          # CPU device, so the section never reaches its CUDA session probe here and a grep
          # for its warnings could not fail; assert instead that it exists and that its
          # providers line agrees with the wheel this variant ships.
          if ! grep -Eq '[[:space:]]ONNX Runtime[[:space:]]*$' doctor.log; then
            echo "::error::facet.py --doctor printed no 'ONNX Runtime' section in the $VARIANT image (issue #229)."
            fail=1
          fi
          ort_providers=$(grep -E 'Execution providers:' doctor.log || true)
          echo "doctor: ${ort_providers:-no Execution providers line}"
          if printf '%s' "$ort_providers" | grep -q CUDAExecutionProvider; then doctor_lists_cuda=1; else doctor_lists_cuda=0; fi
          if [ -z "$ort_providers" ] || [ "$doctor_lists_cuda" != "$EXPECT_ORT_CUDA" ]; then
            echo "::error::the doctor's 'Execution providers' line is '${ort_providers:-missing}'; CUDAExecutionProvider should be listed exactly when EXPECT_ORT_CUDA=$EXPECT_ORT_CUDA (issue #229)."
            fail=1
          fi

          # The only check here that exercises the root branch's chown decision (the
          # group_add check below exercises its privilege drop):
          # a pre-existing, world-readable /config/scoring_config.json must
          # survive a container start byte-for-byte. This is the regression
          # test for issue #127 — under rootless Podman the entrypoint's old
          # unconditional chown/chmod reassigned an operator's own config to
          # the container's subuid ON THE HOST on every single restart,
          # locking them out of editing it again without sudo. The other
          # branch (a config the runtime user genuinely cannot read) needs a
          # file the "facet" uid cannot read even via its world bits, which a
          # host-side bind mount can't easily stage from this workflow — that
          # path is NOT currently exercised by any automated test (it is not
          # covered by tests/test_docker_entrypoint.py either, whose stub-PATH
          # class fakes uid 0 and setpriv). Its intended home is a dedicated uid-0
          # smoke step here that bind-mounts a config unreadable by the
          # "facet" uid and asserts the ownership-takeover + warning fire.
          cfg_dir=$(mktemp -d)
          # 0755, not mktemp's 0700: the entrypoint chowns /config itself to
          # the container's "facet" uid, and this directory IS that mount. At
          # 0700 the runner would lose search permission on its own temp
          # directory the moment the container exited, and every line below --
          # the stat, the cat, the cleanup -- would die on EACCES under the
          # `set -e` at the top of this script, failing the publish over a
          # check that had actually passed.
          chmod 755 "$cfg_dir"
          printf '{"viewer": {"password": "not-a-real-secret"}}\n' > "$cfg_dir/scoring_config.json"
          chmod 644 "$cfg_dir/scoring_config.json"
          before=$(stat -c '%a %u %i' "$cfg_dir/scoring_config.json")
          before_content=$(cat "$cfg_dir/scoring_config.json")
          docker run --rm -v "$cfg_dir":/config "$image" true
          after=$(stat -c '%a %u %i' "$cfg_dir/scoring_config.json")
          after_content=$(cat "$cfg_dir/scoring_config.json")
          echo "pre-existing config mode/owner/inode: '$before' -> '$after'"
          if [ "$before" != "$after" ] || [ "$before_content" != "$after_content" ]; then
            echo "::error::issue #127 regression: a pre-existing /config/scoring_config.json changed (mode/owner/inode '$before' -> '$after') across a container start with no other change to it. The entrypoint must leave an existing, readable config's mode, ownership and content alone."
            fail=1
          fi
          # Best-effort: the directory now belongs to the container's uid, so
          # only its contents are still the runner's to remove. The runner is
          # ephemeral and the leftover is a temp directory either way -- this
          # must never be the thing that fails a publish.
          rm -rf "$cfg_dir" 2>/dev/null || true
          # Issue #208: compose `group_add` gids must survive the root->facet
          # drop (gosu discarded them). Real root branch, real setpriv.
          groups=$(docker run --rm --group-add 101 "$image" id -G)
          echo "supplementary groups with --group-add 101: '$groups'"
          if [ "$groups" != "1000 101" ]; then
            echo "::error::issue #208 regression: with --group-add 101 the unprivileged process has groups '$groups', expected '1000 101'. The entrypoint's privilege drop must keep the gids compose group_add gave the root process."
            fail=1
          fi
          groups=$(docker run --rm "$image" id -G)
          if [ "$groups" != "1000" ]; then
            echo "::error::unexpected supplementary groups without --group-add: '$groups', expected '1000'."
            fail=1
          fi

          exit $fail

      - name: Push
        # Only reached when the smoke test passed, so publishing stays gated on
        # an image that actually ran. This is build-push-action again rather
        # than a plain `docker push` of the loaded tags, because the two do not
        # publish the same thing: buildx attaches an in-toto SLSA provenance
        # attestation (and here an SBOM) and pushes an OCI index, while the
        # daemon pushes a bare Docker v2 manifest with neither. Every Facet
        # image published so far carries that attestation, and dropping it
        # would leave `cosign verify-attestation` / `gh attestation verify`
        # with no subject -- i.e. no way to tell a release build from an image
        # someone pushed by hand with a leaked packages:write token.
        # This does NOT build a second time: every layer is already in the GHA
        # cache from the Build step, so the step re-exports and uploads.
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            STRIP_TORCH=${{ matrix.strip_torch }}
            INSTALL_CUML=${{ matrix.install_cuml }}
            REQUIREMENTS_LOCK=${{ matrix.requirements_lock }}
          cache-from: type=gha,scope=${{ matrix.name }}
