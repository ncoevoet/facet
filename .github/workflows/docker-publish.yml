name: Docker Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Slim CPU image — the default `docker compose up` pull target.
          - name: cpu
            suffix: ""
            base_image: python:3.12-slim
            strip_torch: "0"
            install_cuml: "0"
          # Full CUDA + RAPIDS cuML image, unchanged behaviour from a local
          # `docker build` with the Dockerfile's own defaults.
          - name: cuda
            suffix: "-cuda"
            base_image: pytorch/pytorch:2.6.0-cuda12.6-cudnn9-runtime
            strip_torch: "1"
            install_cuml: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Disable metadata-action's own auto-latest heuristic — with two
          # variants pushing to the same image name, it would tag the CUDA
          # build "latest" (no suffix) too and clobber the CPU image's tag.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}}${{ matrix.suffix }}
            type=raw,value=latest${{ matrix.suffix }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # x86_64 only, stated explicitly rather than inherited from the runner.
          # arm64 would have to cross-build under QEMU, which for a multi-GB ML
          # image costs hours per tag, and the CUDA variant is amd64-only anyway.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            STRIP_TORCH=${{ matrix.strip_torch }}
            INSTALL_CUML=${{ matrix.install_cuml }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
