name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test dependencies
        run: pip install pytest pytest-asyncio pytest-cov fastapi[standard] httpx pyjwt pillow numpy scipy scikit-learn opencv-python-headless tqdm aiosqlite sqlite-vec imagehash psutil watchdog
      - name: Run tests
        run: python -m pytest --tb=short -q --cov=api --cov=processing --cov=analyzers --cov=config --cov=utils --cov-report=term-missing
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: schema.d.ts is regenerated from the live OpenAPI schema
        # This job is the only one whose pip install makes `api` importable, so
        # the dump has to run here; `lint` installs ruff and mypy only. The
        # generator falls back to `npx --yes openapi-typescript@<pinned>` when
        # client/node_modules is absent, so this costs no Angular install.
        env:
          PYTHON: python
        run: npm run gen:api
        working-directory: client
      - name: schema.d.ts is up to date
        # Catches the subtractive direction the compiler cannot see: deleting a
        # response_model, or a field from one, still type-checks on both sides.
        run: |
          # `git diff --exit-code` exits 0 for an UNTRACKED path, which would make
          # this gate silently vacuous if the generated file ever stopped being
          # committed. Assert it is tracked first.
          if ! git ls-files --error-unmatch client/src/app/core/api/schema.d.ts > /dev/null 2>&1; then
            echo "::error file=client/src/app/core/api/schema.d.ts::schema.d.ts is not tracked by git, so the staleness check below cannot fail. Commit it."
            exit 1
          fi
          if ! git diff --exit-code client/src/app/core/api/schema.d.ts; then
            echo "::error file=client/src/app/core/api/schema.d.ts::schema.d.ts is out of date with the FastAPI response models."
            echo "Run 'cd client && npm run gen:api' and commit the result."
            exit 1
          fi

  windows-tests:
    name: Python Tests (Windows)
    # Runs after the Linux suite: no point spending a Windows runner on a tree
    # that is already red, and this is the last gate rather than a parallel one.
    needs: python-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test dependencies
        run: pip install pytest pytest-asyncio pytest-cov fastapi[standard] httpx pyjwt pillow numpy scipy scikit-learn opencv-python-headless tqdm aiosqlite sqlite-vec imagehash psutil
      - name: Run the platform-sensitive suites
        # Deliberately NOT the whole suite. Much of it hard-codes POSIX paths
        # ("/lib/a.jpg") that no Windows path ever matches, so a full run is
        # permanently red and therefore ignored. These two files are the actual
        # platform surface: the library lock picks a different backend here
        # (msvcrt byte-range locks, which have no shared mode), and the device
        # policy resolves CUDA/MPS/CPU. Both were unexercised until this job.
        run: python -m pytest tests/test_scan.py tests/test_device.py -q --tb=short

  angular-tests:
    name: Angular Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client/package.json
      - run: npm install --no-audit --no-fund
      - run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check . --select E,F,W --ignore E501
      - name: Type check (ratchet against mypy-baseline.txt)
        # Not advisory: fails when the error count exceeds the committed
        # baseline. The baseline only ever goes down -- fix errors and lower
        # mypy-baseline.txt in the same change, never raise it to make room
        # for new ones. mypy's own exit code is the source of truth: 0 is
        # clean, 1 is "errors found", anything else is a crash or usage
        # error that must fail loudly rather than silently read as 0 errors.
        # The count is environment-dependent: this job installs only `ruff
        # mypy` above, so mypy resolves far fewer imports than it would in a
        # venv with the project's own dependencies (fastapi, pydantic,
        # numpy, torch, ...) installed, which reports a different, higher
        # count. The baseline tracks THIS job's environment, not a dev venv.
        run: |
          set +e
          output=$(mypy api/ 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            current=0
          elif [ "$status" -eq 1 ]; then
            matches=$(echo "$output" | grep -cE 'Found [0-9]+ error' || true)
            if [ "$matches" -ne 1 ]; then
              echo "::error::mypy exited 1 but printed $matches 'Found N error' summary lines (expected exactly 1). Cannot trust the measurement."
              exit 1
            fi
            current=$(echo "$output" | grep -oE 'Found [0-9]+ error' | grep -oE '[0-9]+')
          else
            echo "::error::mypy exited $status (crash or usage error, not 0-clean / 1-errors-found). Cannot trust the measurement."
            exit 1
          fi
          baseline=$(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' mypy-baseline.txt)
          if ! [[ "$baseline" =~ ^[0-9]+$ ]]; then
            echo "::error::mypy-baseline.txt must contain a single non-negative integer (surrounding whitespace is trimmed); got '$baseline'. Cannot trust the measurement."
            exit 1
          fi
          echo "mypy errors: $current (baseline: $baseline)"
          if [ "$current" -gt "$baseline" ]; then
            echo "::error::mypy error count increased from $baseline to $current. Fix the new errors instead of raising mypy-baseline.txt."
            exit 1
          fi
          if [ "$current" -lt "$baseline" ]; then
            echo "::notice::mypy error count decreased from $baseline to $current. Lower mypy-baseline.txt to $current to lock in the improvement."
          fi
      - name: Forbid broken FastAPI auth mock pattern
        run: |
          # Catches both direct ("api.routers.albums.require_edition") and
          # f-string interpolated (f"{_ALBUMS_MODULE}.get_optional_user")
          # forms. Anchored on the auth function name, not the module prefix.
          if grep -rEn 'mock\.patch\([^)]*\.(require_[a-z_]+|get_optional_user)' tests/ ; then
            echo "::error::Found broken Pattern A — mock.patch on module-level FastAPI auth dependencies."
            echo "::error::These patches are no-ops against Depends()-captured references; tests will pass-by-accident."
            echo "Use the conftest fixtures (edition_client / regular_client / superadmin_client / anonymous_client)"
            echo "or app.dependency_overrides[require_edition] = lambda: ... instead. See tests/conftest.py."
            exit 1
          fi
      - name: Forbid Dockerfile COPY of untracked paths
        run: |
          # A clean clone contains only git-tracked files. If the Dockerfile
          # COPYs a path that isn't tracked (e.g. a leftover dir that only
          # exists on a contributor's machine), `docker build` fails on a fresh
          # checkout with `"/<path>": not found` (issue #10). Assert every local
          # COPY source is tracked. `--from=<stage>` COPYs read from a build
          # stage rather than the git context, so they are skipped.
          set -f
          fail=0
          while IFS= read -r line; do
            set -- $line
            shift                          # drop the COPY keyword
            srcs=(); from_stage=0
            for tok in "$@"; do
              case "$tok" in
                --from=*) from_stage=1 ;;
                --*) ;;                    # ignore other flags (e.g. --chown)
                *) srcs+=("$tok") ;;
              esac
            done
            [ "$from_stage" = 1 ] && continue
            (( ${#srcs[@]} >= 2 )) || continue
            unset 'srcs[${#srcs[@]}-1]'    # drop the destination (last token)
            for s in "${srcs[@]}"; do
              if [ -z "$(git ls-files -- "$s")" ]; then
                echo "::error file=Dockerfile::COPY source '$s' is not git-tracked; it is absent on a clean clone and the build will fail."
                fail=1
              fi
            done
          done < <(grep -iE '^[[:space:]]*COPY[[:space:]]' Dockerfile)
          [ "$fail" = 0 ] && echo "All Dockerfile COPY sources are git-tracked."
          exit $fail
      - name: Every top-level module/package is packaged
        # Catches the other direction from the check above: a top-level *.py
        # module or __init__.py package that IS git-tracked but was never
        # added to the Dockerfile's COPY set or to pyproject.toml's
        # py-modules / packages.find.include -- how sync/ shipped 2026-07-01
        # and was absent from both until this gate existed.
        run: python scripts/check_packaging.py
      - name: Translation bundles agree with en.json
        # Stdlib-only and self-locating, so it needs no pip install and no venv.
        # tests/test_audit_i18n.py already exercises this script's logic against
        # temp fixtures -- nothing gated the REAL bundles until this step.
        # Linux only, but no longer for a portability reason -- the script now
        # reads with an explicit encoding, so a cp1252 runner would be fine. The
        # bundles are platform-independent, so a second run would add cost and
        # no signal. Checks both directions: a key missing from a translation,
        # and a stray key absent from en.json.
        run: python scripts/audit_i18n.py
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client/package.json
      - name: keys.ts is regenerated from en.json
        # Catches the subtractive direction the compiler cannot see: deleting a
        # key from en.json without regenerating keys.ts still type-checks today.
        # The generator imports only node:fs/node:path, so it runs before
        # npm install and costs nothing.
        run: |
          node client/scripts/gen-i18n-keys.mjs
          if ! git diff --exit-code client/src/app/core/i18n/keys.ts; then
            echo "::error file=client/src/app/core/i18n/keys.ts::keys.ts is out of date with i18n/translations/en.json."
            echo "Run 'cd client && npm run gen:i18n' and commit the result."
            exit 1
          fi
      - name: Icon-only buttons have an accessible name
        # <mat-icon> renders aria-hidden internally and matTooltip is not an
        # accessible name, so an icon-only mat-icon-button with neither
        # aria-label nor [attr.aria-label] is announced as just "button" by a
        # screen reader. Stdlib-only (node:fs/node:path), so it runs before
        # npm install and costs nothing.
        run: node client/scripts/check-icon-button-labels.mjs
      - run: npm install --no-audit --no-fund
        working-directory: client
      - run: npx ng lint
        working-directory: client
      - name: Typecheck the client
        # The two leaf projects, never the root tsconfig.json: that one is
        # solution-style ("files": [] plus references), so -p tsconfig.json
        # compiles nothing and exits 0 however broken the tree is.
        working-directory: client
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npx tsc --noEmit -p tsconfig.spec.json
