name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    # A pull request runs the full Python suites (four parallel Linux shards,
    # plus Windows) unless it changes only client/, i18n/, docs/, .claude/, the
    # READMEs or the CHANGELOG. Such a pull request still runs the
    # Python tests that check NON-Python files against the server (client
    # interfaces and schema.d.ts, the agent UI schema and smart-album fixture,
    # keys.ts and the i18n bundles, the AGENTS / THIRD_PARTY_MODELS docs) and
    # the gen:api staleness check: about a minute. The Angular tests run only
    # when client/, the i18n bundles (a spec imports them) or this workflow change; an API
    # change reaches them through the regenerated client/.../schema.d.ts.
    # Pushes to master always run everything.
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.filter.outputs.scope }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: filter
        # A pull_request checkout is the merge of the PR into the CURRENT base,
        # so HEAD^1 is that base: diffing against it gives exactly the PR's own
        # changes. pull_request.base.sha is not: it can lag behind a base that
        # moved since the last push, and the diff then sweeps in the base's own
        # .py changes.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "client=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists both sides of a move, so a module moved into an
          # allowlisted area still shows the path it was deleted from.
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
          echo "$changed"
          # An allowlist, not just "a .py changed": the full suite also reads
          # config/scoring_config.default.json, the Lua plugin, tests/fixtures,
          # install.sh, the requirements and pyproject, so any path outside the
          # areas below runs it, and so does any .py inside them (i18n/__init__.py).
          if echo "$changed" | grep -qE '\.py$' ||
            echo "$changed" | grep -qvE '^(client/|i18n/|docs/|\.claude/|README[^/]*\.md$|CHANGELOG\.md$)'; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
          else
            echo "Only client, i18n and docs changed: running only the cross-file Python checks."
            echo "scope=cross-file" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(client|i18n)/|^\.github/workflows/ci\.yml$'; then
            echo "client=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing under client/ or i18n/ changed: skipping the Angular tests."
            echo "client=false" >> "$GITHUB_OUTPUT"
          fi

  python-tests-shard:
    name: Python Tests (shard ${{ matrix.shard }})
    # The full suite is ~27 min on one 4-vCPU runner, so it runs as four jobs
    # of four xdist workers each; FACET_TEST_SHARD picks a job's files
    # (tests/_sharding.py). A cross-file pull request runs one job only.
    # "Python Tests" below is the single status branch protection requires.
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.scope == 'full' && '[1, 2, 3, 4]' || '[1]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install ExifTool for real metadata round trips
        run: |
          sudo apt-get update
          sudo apt-get install --yes libimage-exiftool-perl
          exiftool -ver
      - name: Install test dependencies
        # This line is the only dependency source for the job (it does not read
        # the lock files). jsonschema and pytest-timeout are the two exceptions
        # that are pinned, at their lock-file versions: without jsonschema the
        # schema tests in tests/test_config_schema.py skip silently, and without
        # pytest-timeout the `timeout` marker is an inert unknown mark. The
        # versions are the ones verified against the suite.
        run: pip install pytest pytest-asyncio pytest-cov fastapi[standard] httpx pyjwt mcp==2.3.0 websockets pillow pillow-heif numpy scipy scikit-learn opencv-python-headless tqdm aiosqlite sqlite-vec imagehash psutil watchdog send2trash tifffile imagecodecs lupa jsonschema==4.26.0 pytest-timeout==2.4.0 pytest-xdist==3.8.0
      - name: Run tests
        env:
          SCOPE: ${{ needs.changes.outputs.scope }}
          FACET_TEST_SHARD: ${{ needs.changes.outputs.scope == 'full' && format('{0}/4', matrix.shard) || '' }}
          COVERAGE_FILE: coverage-shard-${{ matrix.shard }}.dat
        run: |
          if [ "$SCOPE" = "full" ]; then
            python -m pytest -n 4 --durations=30 --tb=short -q --cov=api --cov=processing --cov=analyzers --cov=config --cov=utils --cov-report=
          else
            python -m pytest -n 4 --tb=short -q -m cross_file
          fi
      - name: Keep this shard's coverage data
        if: needs.changes.outputs.scope == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-shard-${{ matrix.shard }}.dat
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - uses: actions/setup-node@v7
        if: matrix.shard == 1
        with:
          node-version: "24"
      - name: schema.d.ts is regenerated from the live OpenAPI schema
        if: matrix.shard == 1
        # This job is the only one whose pip install makes `api` importable, so
        # the dump has to run here; `lint` installs ruff and mypy only. The
        # generator falls back to `npx --yes openapi-typescript@<pinned>` when
        # client/node_modules is absent, so this costs no Angular install.
        env:
          PYTHON: python
        run: npm run gen:api
        working-directory: client
      - name: schema.d.ts is up to date
        if: matrix.shard == 1
        # Catches the subtractive direction the compiler cannot see: deleting a
        # response_model, or a field from one, still type-checks on both sides.
        run: |
          # `git diff --exit-code` exits 0 for an UNTRACKED path, which would make
          # this gate silently vacuous if the generated file ever stopped being
          # committed. Assert it is tracked first.
          if ! git ls-files --error-unmatch client/src/app/core/api/schema.d.ts > /dev/null 2>&1; then
            echo "::error file=client/src/app/core/api/schema.d.ts::schema.d.ts is not tracked by git, so the staleness check below cannot fail. Commit it."
            exit 1
          fi
          if ! git diff --exit-code client/src/app/core/api/schema.d.ts; then
            echo "::error file=client/src/app/core/api/schema.d.ts::schema.d.ts is out of date with the FastAPI response models."
            echo "Run 'cd client && npm run gen:api' and commit the result."
            exit 1
          fi

  python-tests:
    name: Python Tests
    # Required by branch protection, so it keeps this name and reports the
    # shards' outcome; it also prints the coverage of the whole suite.
    needs: [changes, python-tests-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.python-tests-shard.result }}
        run: |
          echo "shards: $RESULT"
          [ "$RESULT" = "success" ]
      - uses: actions/checkout@v7
        if: needs.changes.outputs.scope == 'full'
      - uses: actions/setup-python@v7
        if: needs.changes.outputs.scope == 'full'
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.scope == 'full'
        with:
          pattern: coverage-shard-*
          merge-multiple: true
      - name: Coverage of the whole suite
        if: needs.changes.outputs.scope == 'full'
        run: |
          pip install coverage
          coverage combine --keep coverage-shard-*.dat
          coverage report -m

  windows-tests:
    name: Python Tests (Windows)
    # Runs beside the Linux shards rather than after them: waiting for Linux
    # added its ~12 min to every pull request's critical path.
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install ExifTool for real metadata round trips
        run: |
          choco install exiftool --yes --no-progress
          exiftool -ver
      - name: ExifTool is new enough
        # 13.23 to 13.27 corrupt darktable XMP sidecars and Facet refuses to write with them.
        shell: bash
        run: python -c "import subprocess,sys; v=tuple(map(int,subprocess.check_output(['exiftool','-ver'],text=True).strip().split('.')[:2])); sys.exit(0 if v>=(13,28) else 1)"
      - name: Install test dependencies
        # Same list as python-tests-shard, plus pytest-xdist: the suite imports tifffile,
        # imagecodecs and lupa, and jsonschema keeps tests/test_config_schema.py from skipping.
        run: pip install pytest pytest-asyncio pytest-cov fastapi[standard] httpx pyjwt mcp==2.3.0 websockets pillow pillow-heif numpy scipy scikit-learn opencv-python-headless tqdm aiosqlite sqlite-vec imagehash psutil watchdog send2trash tifffile imagecodecs lupa jsonschema==4.26.0 pytest-timeout==2.4.0 pytest-xdist==3.8.0
      - name: Show the text encoding under test
        # PYTHONUTF8 is deliberately not set: the runner's cp1252 default is what the
        # suite must survive, so the log proves it is exercised.
        run: python -c "import locale,sys; print(locale.getpreferredencoding(False), sys.flags.utf8_mode)"
      - name: Run the whole suite
        # Everything, as on Linux. Under pytest-timeout's Windows `thread` method a timeout
        # kills the xdist worker instead of failing one test, so read a crashed-worker
        # report as a timeout.
        run: python -m pytest -n 4 --durations=30 --tb=short -q --timeout=600

  lock-resolve:
    name: Dependency locks resolve (${{ matrix.lock }})
    # The Docker images `pip install -r` a lock, and nothing else ever does:
    # a Dependabot bump of one pin whose new version needs a newer transitive
    # pin (aiohttp 3.14.4 -> yarl>=1.25.1, virtualenv 21.14.7 ->
    # python-discovery>=1.6.1) passed every other gate and broke the image
    # build, the second time only once v1.22.0 was tagged. A dry run resolves
    # the whole lock without installing it, on each image's Python.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lock: requirements.lock.txt
            python: "3.12"
          - lock: requirements.legacy.lock.txt
            python: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet --upgrade pip
      - run: python -m pip install --dry-run --ignore-installed --quiet -r "${{ matrix.lock }}"
      - name: Resolves with the restricted lock on the CUDA image's base torch
        # A CUDA image keeps its base image's torch and then installs this lock
        # and its restricted twin on top. A pin the base torch excludes makes pip
        # swap torch for another build, which the Dockerfile's torch guard
        # refuses: setuptools 84.1.0 against torch 2.11.0's `setuptools<82`
        # broke the v1.23.0 cuda image after every CI gate had passed. The torch
        # version is read from docker-publish.yml, so the two cannot drift. Only
        # the entries that keep their base torch (strip_torch "1") count: the
        # CPU image installs its torch from the CPU index instead.
        env:
          LOCK: ${{ matrix.lock }}
        run: |
          python -m pip install --quiet pyyaml
          torch=$(python -c 'import os, yaml; entries = yaml.safe_load(open(".github/workflows/docker-publish.yml"))["jobs"]["build-and-push"]["strategy"]["matrix"]["include"]; found = [e["expect_torch"].split("+")[0] for e in entries if e["requirements_lock"] == os.environ["LOCK"] and e["strip_torch"] == "1"]; assert len(found) == 1, found; print(found[0])')
          echo "Resolving $LOCK and ${LOCK%.lock.txt}.restricted.lock.txt on torch==$torch"
          python -m pip install --dry-run --ignore-installed --quiet -r "$LOCK" -r "${LOCK%.lock.txt}.restricted.lock.txt" "torch==$torch"

  angular-tests:
    name: Angular Tests
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check . --select E,F,W --ignore E501
      - name: Type check (ratchet against mypy-baseline.txt)
        # Not advisory: fails when the error count exceeds the committed
        # baseline. See scripts/check_mypy_ratchet.py's docstring for the
        # full rationale, including why the count is environment-dependent
        # (this job installs only `ruff mypy` above, so mypy resolves far
        # fewer imports than a dev venv with the project's own dependencies
        # installed, which reports a different, higher count).
        run: python scripts/check_mypy_ratchet.py
      - name: docker-entrypoint.sh parses (sh -n)
        # A syntax error here is a container that never starts -- POSIX sh
        # gives no other static check, and the Python test suite below drives
        # behaviour, not parseability. Catches the shape of mistake a shell
        # edit makes easiest: an unmatched quote or a stray fi/then.
        run: sh -n docker-entrypoint.sh
      - name: Forbid broken FastAPI auth mock pattern
        run: |
          # Catches both direct ("api.routers.albums.require_edition") and
          # f-string interpolated (f"{_ALBUMS_MODULE}.get_optional_user")
          # forms. Anchored on the auth function name, not the module prefix.
          if grep -rEn 'mock\.patch\([^)]*\.(require_[a-z_]+|get_optional_user)' tests/ ; then
            echo "::error::Found broken Pattern A — mock.patch on module-level FastAPI auth dependencies."
            echo "::error::These patches are no-ops against Depends()-captured references; tests will pass-by-accident."
            echo "Use the conftest fixtures (edition_client / regular_client / superadmin_client / anonymous_client)"
            echo "or app.dependency_overrides[require_edition] = lambda: ... instead. See tests/conftest.py."
            exit 1
          fi
      - name: Forbid Dockerfile COPY of untracked paths
        run: |
          # A clean clone contains only git-tracked files. If the Dockerfile
          # COPYs a path that isn't tracked (e.g. a leftover dir that only
          # exists on a contributor's machine), `docker build` fails on a fresh
          # checkout with `"/<path>": not found` (issue #10). Assert every local
          # COPY source is tracked. `--from=<stage>` COPYs read from a build
          # stage rather than the git context, so they are skipped.
          set -f
          fail=0
          while IFS= read -r line; do
            set -- $line
            shift                          # drop the COPY keyword
            srcs=(); from_stage=0
            for tok in "$@"; do
              case "$tok" in
                --from=*) from_stage=1 ;;
                --*) ;;                    # ignore other flags (e.g. --chown)
                *) srcs+=("$tok") ;;
              esac
            done
            [ "$from_stage" = 1 ] && continue
            (( ${#srcs[@]} >= 2 )) || continue
            unset 'srcs[${#srcs[@]}-1]'    # drop the destination (last token)
            for s in "${srcs[@]}"; do
              if [ -z "$(git ls-files -- "$s")" ]; then
                echo "::error file=Dockerfile::COPY source '$s' is not git-tracked; it is absent on a clean clone and the build will fail."
                fail=1
              fi
            done
          done < <(grep -iE '^[[:space:]]*COPY[[:space:]]' Dockerfile)
          [ "$fail" = 0 ] && echo "All Dockerfile COPY sources are git-tracked."
          exit $fail
      - name: Every top-level module/package is packaged
        # Catches the other direction from the check above: a top-level *.py
        # module or __init__.py package that IS git-tracked but was never
        # added to the Dockerfile's COPY set or to pyproject.toml's
        # py-modules / packages.find.include -- how sync/ shipped 2026-07-01
        # and was absent from both until this gate existed.
        run: python scripts/check_packaging.py
      - name: The two dependency locks differ only in the sympy pin
        # requirements.lock.txt (CUDA + CPU images, torch 2.11.0, needs
        # sympy>=1.13.3) and requirements.legacy.lock.txt (cuda-legacy image,
        # torch 2.6.0, needs sympy==1.13.1 exactly) must be identical apart
        # from that one pin -- any other drift (a Dependabot bump landing in
        # one file only, a hand edit, a package added to one but not the
        # other) makes `pip install` settle the mismatch by silently
        # REPLACING the base image's torch with a PyPI build (an 8.75 GB
        # regression that shipped once already, issue #119). Diffs with
        # comments and blank lines stripped so header-comment edits (dates,
        # container-validation notes) don't trip this gate.
        run: |
          strip() { grep -vE '^[[:space:]]*(#|$)' "$1"; }
          if diff -q <(strip requirements.lock.txt) <(strip requirements.legacy.lock.txt) > /dev/null; then
            echo "::error::requirements.lock.txt and requirements.legacy.lock.txt are identical once comments are stripped -- the sympy pins must differ (issue #119); if they don't, the split has no purpose."
            exit 1
          fi
          bad=$(diff <(strip requirements.lock.txt) <(strip requirements.legacy.lock.txt) | grep -E '^[<>]' | grep -vE '^[<>] sympy==[0-9]+(\.[0-9]+)*$' || true)
          if [ -n "$bad" ]; then
            echo "::error::requirements.lock.txt and requirements.legacy.lock.txt must be identical outside the sympy pin. These lines differ -- apply the same change to both files (or revert whichever one drifted):"
            echo "$bad"
            exit 1
          fi
          base_sympy=$(grep -oE '^sympy==[0-9]+(\.[0-9]+)*$' requirements.lock.txt | cut -d= -f3)
          legacy_sympy=$(grep -oE '^sympy==[0-9]+(\.[0-9]+)*$' requirements.legacy.lock.txt | cut -d= -f3)
          # A pin that is missing, or written in a form this pattern does not
          # match (a .post/.dev suffix, an environment marker), makes grep emit
          # nothing while the pipeline still exits 0 -- both variables come out
          # empty and EQUAL, so the next check would report "pinned to the same
          # version ()" and send the reader after a pin that is not there.
          if [ -z "$base_sympy" ] || [ -z "$legacy_sympy" ]; then
            echo "::error::no plain '^sympy==<version>' pin found in requirements.lock.txt (got '$base_sympy') or requirements.legacy.lock.txt (got '$legacy_sympy'). Each lock must carry one, because the base image's torch dictates it (issue #119)."
            exit 1
          fi
          if [ "$base_sympy" = "$legacy_sympy" ]; then
            echo "::error::sympy is pinned to the same version ($base_sympy) in both locks. torch 2.6.0 (legacy) needs sympy==1.13.1 exactly and torch 2.11.0 (base/cpu) needs sympy>=1.13.3 -- they cannot share one pin. Re-derive requirements.lock.txt's sympy pin from its own base image's torch, per issue #119."
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$base_sympy" "$legacy_sympy" | sort -V | tail -1)" != "$base_sympy" ]; then
            echo "::error::requirements.lock.txt's sympy ($base_sympy) is not newer than requirements.legacy.lock.txt's ($legacy_sympy). The CUDA/CPU lock (newer torch, sympy>=1.13.3) is expected to carry the newer pin and the legacy CUDA lock (torch 2.6.0, sympy==1.13.1 exactly) the older one -- check which file's pin actually moved and why."
            exit 1
          fi
          echo "requirements.lock.txt (sympy==$base_sympy) and requirements.legacy.lock.txt (sympy==$legacy_sympy) differ only in the sympy pin, as expected."
          # Packages that api/ imports behind a try/except ImportError which
          # turns that absence into an HTTP error must be pinned in BOTH
          # locks -- an extra (pyproject.toml optional-dependencies) never
          # reaches the Docker/Podman image, which installs only from these
          # lock files, so a package left extra-only answers HTTP 400 at
          # runtime for a feature the docs say is available. This is exactly
          # how send2trash shipped (issue #125): `.[cull]` gated it, the
          # image never installed it, and POST /api/cull/apply's
          # trash_rejects action 400'd on every container.
          #
          # This does NOT close the class of bug automatically -- the array
          # below is hand-maintained, so it only closes the class as far as
          # whoever adds the next such import remembers to also list it here.
          # List every such package here as it is added. The class is
          # currently mechanically derivable (`grep -rn "except ImportError"
          # api/` returns exactly this one HTTP-converting hit today), which
          # is a candidate for automating this list instead of hand-tracking
          # it, should a second hit ever land.
          optional_import_gated_packages=(send2trash)
          for pkg in "${optional_import_gated_packages[@]}"; do
            for lock in requirements.lock.txt requirements.legacy.lock.txt; do
              # Anchored to a bare `pkg==<version>` line: `[^;]*$` rejects a
              # trailing PEP 508 environment marker (e.g.
              # `send2trash==2.1.0 ; sys_platform == "win32"`), which would
              # otherwise pass this gate while pip installs nothing on the
              # platforms that marker excludes -- the exact "pinned but never
              # installed" shape this gate exists to catch.
              if ! grep -qiE "^${pkg}==[0-9][^;]*\$" "$lock"; then
                echo "::error::'${pkg}' is imported behind a try/except ImportError in api/ and turned into an HTTP error when the import fails, but it is not pinned in ${lock}. An image built from this lock answers HTTP 400 at runtime for a feature the docs say is available. Add '${pkg}==<version>' to ${lock}."
                exit 1
              fi
            done
          done
          echo "All optional-import-gated packages (${optional_import_gated_packages[*]}) are pinned in both locks."
      - name: dependabot.yml ignore lists are intact
        # yaml.safe_load is not a sufficient check here: a dropped '-' before
        # a "dependency-name:" line indents that entry into its predecessor,
        # YAML merges it as a duplicate key of the SAME mapping, safe_load
        # returns success, and the earlier entry is silently gone -- exactly
        # how a "tokenizers" ignore once vanished past every naive check.
        # Assert each load-bearing ecosystem's ignore: list by exact name and
        # count instead of trusting a parsed structure a merge could have
        # shrunk, and confirm no ecosystem block itself was lost the same way.
        # docker is asserted as well as pip because its single
        # "pytorch/pytorch" entry is what pins ARG BASE_IMAGE, and the base
        # image decides which sm_ architectures each published tag covers
        # (issue #119). Nothing else would notice it going: docker-publish.yml
        # runs on v* tags only, so its expect_arch smoke test never sees a
        # Dependabot bump until release, long after the PR merged.
        # npm and github-actions are deliberately left unasserted -- neither
        # pins anything a build decision rests on, and gating lists that
        # legitimately churn is how a gate turns into noise.
        run: |
          assert_ignore_list() {
            eco="$1"
            expected="$2"
            block=$(awk -v e="  - package-ecosystem: \"$eco\"" '$0==e{f=1; next} /^  - package-ecosystem: /{f=0} f' .github/dependabot.yml)
            actual=$(echo "$block" | grep -E '^      - dependency-name: "' | sed -E 's/^      - dependency-name: "([^"]*)".*/\1/' | sort | tr '\n' ' ' | sed 's/ $//')
            if [ "$actual" != "$expected" ]; then
              echo "::error file=.github/dependabot.yml::$eco ecosystem ignore: list is {$actual}, expected {$expected}."
              echo "::error file=.github/dependabot.yml::Check for a dropped '-' before a dependency-name: line -- it merges silently into the previous entry instead of raising a YAML error."
              exit 1
            fi
          }
          for eco in pip npm github-actions docker; do
            # `|| true` because grep -c exits 1 on zero matches, and the step
            # runs under GitHub's default `bash -e {0}` -- so a MISSING block,
            # the very case this loop exists to catch, would abort here with a
            # bare red X and none of the message below ever printed.
            count=$(grep -cE "^  - package-ecosystem: \"$eco\"\$" .github/dependabot.yml || true)
            if [ "$count" != "1" ]; then
              echo "::error file=.github/dependabot.yml::expected exactly one \"$eco\" package-ecosystem entry, found $count."
              exit 1
            fi
          done
          assert_ignore_list pip "* mpmath pyarrow pydantic-core sympy tokenizers"
          assert_ignore_list docker "* pytorch/pytorch"
          echo "dependabot.yml: pip and docker ignore lists and all four ecosystems intact."
      - name: Translation bundles agree with en.json
        # Stdlib-only and self-locating, so it needs no pip install and no venv.
        # tests/test_audit_i18n.py already exercises this script's logic against
        # temp fixtures -- nothing gated the REAL bundles until this step.
        # Linux only, but no longer for a portability reason -- the script now
        # reads with an explicit encoding, so a cp1252 runner would be fine. The
        # bundles are platform-independent, so a second run would add cost and
        # no signal. Checks both directions: a key missing from a translation,
        # and a stray key absent from en.json.
        run: python scripts/audit_i18n.py
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: keys.ts is regenerated from en.json
        # Catches the subtractive direction the compiler cannot see: deleting a
        # key from en.json without regenerating keys.ts still type-checks today.
        # The generator imports only node:fs/node:path, so it runs before
        # npm install and costs nothing.
        run: |
          node client/scripts/gen-i18n-keys.mjs
          if ! git diff --exit-code client/src/app/core/i18n/keys.ts; then
            echo "::error file=client/src/app/core/i18n/keys.ts::keys.ts is out of date with i18n/translations/en.json."
            echo "Run 'cd client && npm run gen:i18n' and commit the result."
            exit 1
          fi
      - name: Icon-only buttons have an accessible name
        # <mat-icon> renders aria-hidden internally and matTooltip is not an
        # accessible name, so an icon-only mat-icon-button with neither
        # aria-label nor [attr.aria-label] is announced as just "button" by a
        # screen reader. Stdlib-only (node:fs/node:path), so it runs before
        # npm install and costs nothing.
        run: node client/scripts/check-icon-button-labels.mjs
      - run: node --test client/scripts/check-icon-button-labels.test.mjs
      - run: npm ci --no-audit --no-fund
        working-directory: client
      - run: npx ng lint
        working-directory: client
      - name: Typecheck the client
        # The two leaf projects, never the root tsconfig.json: that one is
        # solution-style ("files": [] plus references), so -p tsconfig.json
        # compiles nothing and exits 0 however broken the tree is.
        working-directory: client
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npx tsc --noEmit -p tsconfig.spec.json
