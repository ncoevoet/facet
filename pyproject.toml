[build-system]
# >=83.0.0 for CVE-2026-59890: below it, `MANIFEST.in` exclusion directives are
# matched byte-for-byte against on-disk names with no Unicode normalization, so
# on macOS APFS/HFS+ a rule saved NFC silently fails to exclude a file written
# NFD and the file lands in the sdist. Facet is not affected today — this
# MANIFEST.in carries no exclusion directives at all, and the repo has no
# non-ASCII filenames — so this floor keeps the build path patched rather than
# incidentally safe, in case an `exclude` is ever added.
#
# This is deliberately NOT the same pin as the RUNTIME one. `requirements.txt`
# caps setuptools <81 because pyiqa's LIQE/CLIPIQA reach PyPI `openai-clip`,
# whose `clip/clip.py` still does `from pkg_resources import packaging`, and
# setuptools 81 removed pkg_resources. PEP 517 build isolation resolves this
# list separately from the installed environment, so the two do not conflict.
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facet-photo"
version = "1.14.2"
description = "AI-powered photo analysis and gallery — score, cull, organise, and explore your photo library with computer vision and face recognition"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Nicolas Coevoet", email = "nicolas@coevoet.fr" },
]
keywords = [
    "photo", "photography", "image-quality", "computer-vision", "aesthetic",
    "face-recognition", "photo-scoring", "self-hosted", "topiq", "clip",
    "image-analysis", "composition", "saliency", "face-clustering",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    # torch and torchvision are installed separately with the correct CUDA index URL.
    # See install.sh or docs/INSTALLATION.md for details.
    "open-clip-torch>=2.20.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "imagehash>=4.3.0",
    "rawpy>=0.18.0",
    "insightface>=0.7.0",
    "pyiqa>=0.1.16",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "hdbscan>=0.8.40",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pyjwt>=2.8.0",
    "tqdm>=4.65.0",
    "exifread>=3.0.0",
    "psutil>=5.9.0",
    "reverse_geocoder>=1.5.1",
    "jsonschema>=4.18.0",
]

[project.optional-dependencies]
vlm = [
    # Bounded to match requirements.txt: floor 5.3.0 patches GHSA-29pf-2h5f-8g72;
    # 5.15.x is the newest validated ceiling for the batched Qwen3.5 tagger.
    "transformers>=5.3.0,<5.16",
    "accelerate>=0.25.0",
]
saliency = [
    # BiRefNet subject saliency uses transformers (AutoModelForImageSegmentation)
    "facet-photo[vlm]",
]
gpu-clustering = [
    "cuml",
    "cupy",
]
cull = [
    # OS-trash for the reject-to-trash cull action (viewer.cull.allow_trash).
    "send2trash>=1.8.0",
]
iqa-extended = [
    # Optional extended-IQA tier (scoring_config.json "iqa_extended"). Only
    # aesthetic_v25 needs a package of its own; Q-ReAlign ships with pyiqa and
    # runs unquantised (~3GB), and DeQA-Score loads via transformers.
    "aesthetic-predictor-v2-5",
]
ocr = [
    # In-photo text search (scoring_config.json "ocr", OFF by default).
    # easyocr is Apache-2.0 and torch-based, so it reuses the stack Facet already
    # ships — it pulls no second cv2 (opencv-python-headless only) and pins no
    # numpy/torch version. Weights (~113MB) download from the project's own
    # GitHub releases on first run. See docs/CONFIGURATION.md "OCR".
    "easyocr>=1.7.2",
]
watch = [
    "watchdog>=4.0",
]
all = [
    "facet-photo[vlm,saliency,watch]",
]

[project.urls]
Homepage = "https://github.com/ncoevoet/facet"
Repository = "https://github.com/ncoevoet/facet"
Documentation = "https://github.com/ncoevoet/facet/tree/master/docs"
Issues = "https://github.com/ncoevoet/facet/issues"
Discussions = "https://github.com/ncoevoet/facet/discussions"

[project.scripts]
facet = "facet:main"
facet-viewer = "viewer:main"
facet-db = "database:main"
facet-tag = "tag_existing:main"
facet-doctor = "diagnostics:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:pydantic",
    "ignore::DeprecationWarning:pkg_resources",
]
markers = [
    "raw_brand_samples: real-file coverage for non-Canon RAW brands (decodes 20-30MB fixtures; skips cleanly when fixtures are absent)",
]

[tool.mypy]
# Type checking is a ratchet, not advisory: the CI lint job runs `mypy api/`
# and fails if the error count exceeds the baseline committed in
# mypy-baseline.txt. The baseline only ever goes down — fix errors and lower
# it in the same change, never raise it to make room for new ones. Heavy ML
# deps (torch, cv2, insightface, ...) ship no type stubs, so missing imports
# are ignored rather than reported.
#
# The baseline number is specific to CI's environment: that job installs only
# `ruff mypy`, with none of the project's own dependencies, so mypy resolves
# far fewer imports there than in a dev venv with fastapi/pydantic/numpy/
# torch/... present — the same tree reports a different, higher count under a
# dev venv. To check the baseline honestly before changing it, reproduce
# CI's number: run mypy from a venv containing only mypy itself, not this
# project's dependencies.
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.setuptools]
py-modules = ["facet", "cli_args", "viewer", "database", "tag_existing", "calibrate", "validate_db", "diagnostics", "config_resolve"]

[tool.setuptools.packages.find]
include = [
    "analyzers*",
    "api*",
    "comparison*",
    "config*",
    "db*",
    "exiftool*",
    "faces*",
    "i18n*",
    "models*",
    "optimization*",
    "processing*",
    "storage*",
    "sync*",
    "utils*",
    "validation*",
    "plugins*",
]
exclude = ["venv*", "client*", "docs*", "photos_all*", "pretrained_models*"]

[tool.setuptools.package-data]
"*" = ["*.json"]
"i18n" = ["*.json"]
# Pre-built Angular client included in package
"api" = ["../client/dist/client/browser/**/*"]

[tool.ruff.lint]
# Pin the rule set explicitly: ruff 0.16 widened its default selection, which
# would turn the documented bare `ruff check .` gate red on unchanged code.
# E,F,W --ignore E501 matches the CI lint step, applied repo-wide.
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These modules intentionally run setup code before their imports — sys.path
# bootstrapping (so a script works when run from any directory) and
# warnings.filterwarnings. Reordering the imports would break that setup, so
# E402 (module-import-not-at-top) is expected and suppressed here.
#
# __init__.py files re-export submodule symbols as the package's public API —
# the imports are intentional even when unused within __init__.py itself.
"**/__init__.py" = ["F401"]
"analyzers/face.py" = ["E402"]
"calibrate.py" = ["E402"]
"config/percentile_normalizer.py" = ["E402"]
"config/scoring_config.py" = ["E402"]
"database.py" = ["E402"]
"db/stats_cache.py" = ["E402"]
"db/tags.py" = ["E402"]
"facet.py" = ["E402"]
"faces/processor.py" = ["E402"]
"processing/batch_processor.py" = ["E402"]
"processing/resource_monitor.py" = ["E402"]
"processing/scorer.py" = ["E402"]
"tag_existing.py" = ["E402"]
